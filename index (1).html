<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電子報成效分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --canvas:#EEF1F5; --card:#FFFFFF; --chrome:#FFFFFF;
  --ink:#1B2432; --ink2:#5B6B80; --ink3:#8A97A8;
  --line:#DFE5EC; --line2:#EDF1F5;
  --c1:#17527A; --c2:#0F8A78; --c3:#B07D18; --c4:#C0206E; --c5:#6B4FA8; --c6:#7A8CA0;
  --rise:#D0342C; --fall:#0F8A78; --warn:#B07D18; --sel:#17527A;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ui:"Noto Sans TC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.topbar{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;height:46px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand .mark{width:19px;height:19px;background:var(--c1);border-radius:3px;position:relative}
.brand .mark::after{content:"";position:absolute;inset:5px 5px auto 5px;height:2px;background:#fff;box-shadow:0 4px 0 #fff,0 8px 0 rgba(255,255,255,.5)}
.brand b{font-size:13.5px;font-weight:700}
.topbar .range{flex:1;min-width:0;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tabs{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;padding:0 12px;overflow-x:auto;position:sticky;top:46px;z-index:39}
.tabs::-webkit-scrollbar{height:0}
.tab{flex:none;border:0;background:none;cursor:pointer;font-family:var(--ui);padding:10px 16px 9px;border-bottom:2px solid transparent;color:var(--ink2);font-size:13px;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--line2)}
.tab.on{color:var(--c1);border-bottom-color:var(--c1);font-weight:700}

.filters{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:7px;padding:9px 16px;align-items:center}
.fgroup{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:3px;padding:2px 4px 2px 8px;flex-wrap:wrap;max-width:100%}
.fgroup>label{font-size:11.5px;color:var(--ink3);margin-right:2px;flex:none}
.fbtn{border:0;background:var(--line2);border-radius:2px;font-family:var(--ui);font-size:11.5px;padding:3px 8px;cursor:pointer;color:var(--ink2)}
.fbtn:hover{background:#E2E8F0}
.fbtn.on{background:var(--sel);color:#fff}
.fresetbtn{font-size:11.5px;color:var(--ink2);border:1px solid var(--line);background:#fff;border-radius:3px;padding:4px 10px;cursor:pointer;font-family:var(--ui)}

.purpose{background:#FBFCFD;border-bottom:1px solid var(--line);padding:11px 16px;font-size:14.5px;font-weight:700}

.canvas{padding:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(12,1fr)}
.c3,.c4,.c6,.c8,.c12{grid-column:span 12}
@media(min-width:700px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c6{grid-column:span 6}}
@media(min-width:1080px){.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;min-width:0}
.chead{display:flex;align-items:center;gap:8px;padding:9px 12px 8px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.chead h3{margin:0;font-size:13px;font-weight:700;flex:1;min-width:0}
.chead p{margin:1px 0 0;font-size:11px;color:var(--ink3);flex-basis:100%}
.cbody{padding:12px;flex:1;min-width:0}
.cbody.tight{padding:8px 10px}

.kpi{padding:12px 14px 13px}
.kpi .lbl{font-size:11.5px;color:var(--ink2);margin-bottom:5px}
.kpi .val{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.1}
.kpi .sub{display:flex;align-items:baseline;gap:9px;margin-top:5px;font-size:11px;flex-wrap:wrap}
.kpi .sub em{font-style:normal;font-family:var(--mono);font-weight:600}
.rise{color:var(--rise)}.fall{color:var(--fall)}.flat{color:var(--ink3)}
.kpi .base{color:var(--ink3);font-size:10.5px}
.kpi.alert{border-left:3px solid var(--warn)}
.kpi.alert .val{color:var(--warn)}

table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-size:11px;color:var(--ink3);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tbody tr:hover{background:#F7FAFC}
table.t td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t th.n{text-align:right}
table.t tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;background:#FAFBFC}
table.t.def th{width:8em;color:var(--ink);font-weight:700;font-size:12px;vertical-align:top;border-bottom:1px solid var(--line2)}
table.t.def td{color:var(--ink2)}
.twrap{overflow-x:auto}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:2px;white-space:nowrap}
.p-up{background:#0F8A7815;color:#0F8A78}
.p-tgt{background:#17527A15;color:var(--c1)}
.p-mv{background:#B07D1815;color:var(--warn)}
.p-out{background:#D0342C12;color:var(--rise)}
.p-na{background:#7A8CA015;color:var(--ink3)}

.note{font-size:11.5px;color:var(--ink2);border-top:1px dashed var(--line);margin:10px -12px -12px;padding:9px 12px 10px;background:#FAFBFC}
.cbody.tight .note{margin:8px -10px -8px;padding:9px 10px 10px}
.note b{color:var(--c4)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11px;color:var(--ink2);margin-top:9px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sheet{display:none}
.sheet.on{display:block}
.defbox{background:#F8FAFC;border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:12px;color:var(--ink2);margin-top:10px}
.defbox b{color:var(--ink)}
.heat{border-collapse:collapse;font-size:11.5px;width:100%}
.heat th{font-size:10.5px;color:var(--ink3);font-weight:500;padding:5px 6px;text-align:center}
.heat th.rowh{text-align:right}
.heat td{text-align:center;padding:9px 4px;font-family:var(--mono);color:#fff;font-size:11px}
.heat td.rowh{text-align:right;color:var(--ink);font-family:var(--ui);font-size:11.5px;padding-right:8px}
.loading,.err{padding:40px;text-align:center;color:var(--ink3);font-size:13px}
.err{color:var(--rise)}
.bignum{font-family:var(--mono);font-weight:700}
.scorebar{position:relative;height:12px;background:var(--line2);border-radius:1px;min-width:50px}
.scorebar i{position:absolute;inset:0 auto 0 0;background:var(--c1);opacity:.75;border-radius:1px}
canvas.chart{max-width:100%}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark"></span><b>電子報成效分析</b></div>
  <div class="range" id="rangeLabel">載入中…</div>
</div>

<nav class="tabs" id="tabs">
  <button class="tab on" data-s="s0">本期總覽</button>
  <button class="tab" data-s="s1">寄送與開信</button>
  <button class="tab" data-s="s2">內容與導流</button>
  <button class="tab" data-s="s3">受眾分群</button>
  <button class="tab" data-s="s4">名單健康</button>
  <button class="tab" data-s="s5">指標定義</button>
</nav>

<div class="filters" id="filters">
  <div class="fgroup"><label>期別</label><div id="fPeriod"></div></div>
  <div class="fgroup"><label>報型</label><div id="fType"></div></div>
  <div class="fgroup"><label>文章大分類　<span style="color:#c0206e">(僅內容與導流頁)</span></label><div id="fMajor"></div></div>
  <button class="fresetbtn" id="fReset" type="button">清除篩選</button>
</div>

<div id="app"><div class="loading">資料載入中…</div></div>

<script>
(function(){
"use strict";

const NAVY="#17527A", GOLD="#B07D18", TEAL="#0F8A78", MUTE="#8A97A8", GRID="#EDF1F5", RED="#D0342C", PURPLE="#6B4FA8", SLATE="#7A8CA0";
const num = n => (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString("zh-Hant");
// eid 在 links.csv 裡已經是雜湊過的代碼（sync_from_sheets.py 在同步時就把真實
// email 雜湊掉了，同一人跨期雜湊值不變，但沒辦法反推回 email），這裡直接顯示即可。
const pct = (n,d=1) => (n==null||isNaN(n)) ? "—" : (n*100).toFixed(d)+"%";
const chgHTML = (cur,prev) => {
  if(cur==null||prev==null||isNaN(cur)||isNaN(prev)||prev===0) return '<span class="flat">— 無上期資料</span>';
  const d=(cur-prev)/Math.abs(prev)*100;
  const cls = d>0.05?"rise":(d<-0.05?"fall":"flat");
  const arrow = d>0.05?"▲":(d<-0.05?"▼":"—");
  return `<em class="${cls}">${arrow} ${Math.abs(d).toFixed(1)}%</em>`;
};

let SENDS=[], LINKS=[], ARTICLES=[], SUMMARY=null;
let PERIODS=[]; // sorted unique dates
let periodType={}; // date -> report_type
let charts={};

function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

// ---------- Load ----------
Promise.all([
  fetch("data/sends.csv").then(r=>{ if(!r.ok) throw new Error("sends.csv "+r.status); return r.text(); }),
  fetch("data/links.csv").then(r=>{ if(!r.ok) throw new Error("links.csv "+r.status); return r.text(); }),
  fetch("data/articles.csv").then(r=>{ if(!r.ok) throw new Error("articles.csv "+r.status); return r.text(); }),
  fetch("data/summary.json").then(r=>{ if(!r.ok) throw new Error("summary.json "+r.status); return r.json(); }),
]).then(([sendsTxt, linksTxt, artTxt, summaryJson])=>{
  SENDS = Papa.parse(sendsTxt, {header:true, dynamicTyping:true, skipEmptyLines:true}).data;
  LINKS = Papa.parse(linksTxt, {header:true, dynamicTyping:true, skipEmptyLines:true}).data;
  ARTICLES = Papa.parse(artTxt, {header:true, dynamicTyping:false, skipEmptyLines:true}).data;
  SUMMARY = summaryJson;
  PERIODS = [...new Set(SENDS.map(r=>r.date))].sort();
  SENDS.forEach(r=> periodType[r.date]=r.report_type);
  document.getElementById("rangeLabel").textContent =
    `${PERIODS.length} 期　${PERIODS[0]} — ${PERIODS[PERIODS.length-1]}`;
  buildFilterUI();
  document.getElementById("app").innerHTML = tabsHTML();
  wireTabs();
  renderAll();
}).catch(err=>{
  document.getElementById("app").innerHTML = `<div class="err">讀不到 data/ 底下的檔案（${err.message}）。請確認 sync_from_sheets.py 已經跑過，且 sends.csv / links.csv / articles.csv / summary.json 都在 data/ 資料夾裡。</div>`;
});

// ---------- Filters ----------
let sel = { periods: null, types: new Set(["主題報","好友報"]), majors: new Set() };

function buildFilterUI(){
  const fp = document.getElementById("fPeriod");
  fp.innerHTML = PERIODS.map(p=>`<button class="fbtn on" data-p="${p}">${p.slice(5)}</button>`).join("");
  sel.periods = new Set(PERIODS);
  fp.querySelectorAll(".fbtn").forEach(b=>{
    b.addEventListener("click", ()=>{
      b.classList.toggle("on");
      const p=b.dataset.p;
      if(b.classList.contains("on")) sel.periods.add(p); else sel.periods.delete(p);
      renderAll();
    });
  });

  const ft = document.getElementById("fType");
  ft.innerHTML = ["主題報","好友報"].map(t=>`<button class="fbtn on" data-t="${t}">${t}</button>`).join("");
  ft.querySelectorAll(".fbtn").forEach(b=>{
    b.addEventListener("click", ()=>{
      b.classList.toggle("on");
      const t=b.dataset.t;
      if(b.classList.contains("on")) sel.types.add(t); else sel.types.delete(t);
      renderAll();
    });
  });

  const majors = [...new Set(ARTICLES.map(r=>r["大分類"]).filter(Boolean))].sort();
  const fm = document.getElementById("fMajor");
  fm.innerHTML = majors.map(m=>`<button class="fbtn" data-m="${m}">${m}</button>`).join("");
  fm.querySelectorAll(".fbtn").forEach(b=>{
    b.addEventListener("click", ()=>{
      b.classList.toggle("on");
      const m=b.dataset.m;
      if(b.classList.contains("on")) sel.majors.add(m); else sel.majors.delete(m);
      renderAll();
    });
  });

  document.getElementById("fReset").addEventListener("click", ()=>{
    sel.periods = new Set(PERIODS);
    sel.types = new Set(["主題報","好友報"]);
    sel.majors = new Set();
    fp.querySelectorAll(".fbtn").forEach(b=>b.classList.add("on"));
    ft.querySelectorAll(".fbtn").forEach(b=>b.classList.add("on"));
    fm.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("on"));
    renderAll();
  });
}

function filteredSends(){ return SENDS.filter(r=> sel.periods.has(r.date) && sel.types.has(r.report_type)); }
function filteredLinks(){ return LINKS.filter(r=> sel.periods.has(r.date) && sel.types.has(r.report_type)); }
function filteredLinksContent(){
  return filteredLinks().filter(r=>{
    if(sel.majors.size===0) return true;
    return sel.majors.has(r["大分類"]);
  });
}
function currentPeriod(){
  const inSel = PERIODS.filter(p=>sel.periods.has(p));
  return inSel.length ? inSel[inSel.length-1] : PERIODS[PERIODS.length-1];
}
function previousPeriod(cur){
  const i = PERIODS.indexOf(cur);
  return i>0 ? PERIODS[i-1] : null;
}
function sendRow(date){ return SENDS.find(r=>r.date===date); }

// ---------- Audience segments (whole-dataset, mirrors scripts/lib logic) ----------
let SEG = null;
function computeSegments(){
  if(SEG) return SEG;
  const eidPeriods={}, eidBuildingClicks={}, eidTotalClicks={};
  LINKS.forEach(r=>{
    if(!r.eid) return;
    (eidPeriods[r.eid] ||= new Set()).add(r.date);
    const c = r.clicks||0;
    eidTotalClicks[r.eid] = (eidTotalClicks[r.eid]||0)+c;
    if(r.category==="建案") eidBuildingClicks[r.eid] = (eidBuildingClicks[r.eid]||0)+c;
  });
  const groups = { 核心重疊:new Set(), 準買家:new Set(), 高頻讀者:new Set() };
  Object.keys(eidPeriods).forEach(eid=>{
    const n = eidPeriods[eid].size;
    const bld = eidBuildingClicks[eid]||0;
    const tot = eidTotalClicks[eid]||0;
    const ratio = tot ? bld/tot : 0;
    if(n>=3 && bld>0) groups.核心重疊.add(eid);
    if(tot>0 && ratio>=0.5) groups.準買家.add(eid);
    if(n>=3 && bld===0) groups.高頻讀者.add(eid);
  });
  SEG = { eidPeriods, eidBuildingClicks, eidTotalClicks, groups };
  return SEG;
}
function segmentOf(eid, seg){
  if(seg.groups.核心重疊.has(eid)) return "核心重疊";
  if(seg.groups.準買家.has(eid)) return "準買家";
  if(seg.groups.高頻讀者.has(eid)) return "高頻讀者";
  return "其他";
}

// ---------- Tab shells ----------
function tabsHTML(){
  return `
  <section class="sheet on" id="s0"><div class="purpose">這期比上期好還是壞？</div><div class="canvas"><div class="grid" id="g0"></div></div></section>
  <section class="sheet" id="s1"><div class="purpose">信有沒有寄到、有沒有人開？</div><div class="canvas"><div class="grid" id="g1"></div></div></section>
  <section class="sheet" id="s2"><div class="purpose">哪些內容有效？導了多少人回官網？</div><div class="canvas"><div class="grid" id="g2"></div></div></section>
  <section class="sheet" id="s3"><div class="purpose">誰值得投資？（此頁固定分析全部 ${PERIODS.length} 期，不受上方期別篩選影響）</div><div class="canvas"><div class="grid" id="g3"></div></div></section>
  <section class="sheet" id="s4"><div class="purpose">名單在長還是在死？</div><div class="canvas"><div class="grid" id="g4"></div></div></section>
  <section class="sheet" id="s5"><div class="purpose">這些數字可以信到什麼程度？</div><div class="canvas"><div class="grid" id="g5"></div></div></section>
  `;
}
function wireTabs(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
      t.classList.add("on");
      document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("on"));
      document.getElementById(t.dataset.s).classList.add("on");
      window.scrollTo(0,0);
    });
  });
}

function renderAll(){
  renderOverview();
  renderSend();
  renderContent();
  renderAudience();
  renderHealth();
  renderDefs();
}

// ================= Tab 0: 本期總覽 =================
function renderOverview(){
  const cur = currentPeriod(), prev = previousPeriod(cur);
  const curRow = sendRow(cur), prevRow = prev ? sendRow(prev) : null;
  const curLinks = LINKS.filter(r=>r.date===cur && r.eid);
  const prevLinks = prev ? LINKS.filter(r=>r.date===prev && r.eid) : [];
  const curReach = new Set(curLinks.map(r=>r.eid)).size;
  const prevReach = new Set(prevLinks.map(r=>r.eid)).size;

  const kpis = [
    ["送達率", curRow.pct_delivered, prevRow?prevRow.pct_delivered:null, false],
    ["開信率　（佔送達數）", curRow.pct_opened, prevRow?prevRow.pct_opened:null, false],
    ["開信點擊率　（佔開信人數）", curRow.click_to_open_ratio, prevRow?prevRow.click_to_open_ratio:null, false],
    ["退訂率", curRow.pct_unsubscribed, prevRow?prevRow.pct_unsubscribed:null, true],
  ];

  let html = kpis.map(([lbl,c,p,alert])=>`
    <div class="card c3"><div class="kpi ${alert && c>0.01?'alert':''}">
      <div class="lbl">${lbl}</div><div class="val">${pct(c)}</div>
      <div class="sub">${chgHTML(c,p)}<span class="base">上期 ${prev? pct(p)+'（'+prev+'）':'無'}</span></div>
    </div></div>`).join("");

  html += `
    <div class="card c3"><div class="kpi">
      <div class="lbl">本期導入官網不重複人數</div><div class="val">${num(curReach)}</div>
      <div class="sub">${chgHTML(curReach,prevReach)}<span class="base">上期 ${prev?num(prevReach):'無'}</span></div>
    </div></div>
    <div class="card c3"><div class="kpi">
      <div class="lbl">本期　${cur}</div><div class="val" style="font-size:18px">${curRow.report_type}</div>
      <div class="sub"><span class="base">送達 ${num(curRow.delivered)}　開信 ${num(curRow.opened)}　點擊 ${num(curRow.clicked_email)}</span></div>
    </div></div>

    <div class="card c12"><div class="cbody" style="padding:10px 14px">
      <div style="font-size:12px;color:var(--ink2)">
        <b style="color:var(--ink)">每一期只送一種報型（主題報與好友報交替發送），所以「本期」永遠只對應一種報型，「上期」是時間序上緊接的前一期（另一種報型）。</b>
        變化率一律為<b style="color:var(--ink)">相對上期</b>的增減幅度；紅色代表上升、綠色代表下降，只表示方向不代表好壞（退訂率紅色是變差）。
      </div>
    </div></div>

    <div class="card c8">
      <div class="chead"><h3>期別趨勢</h3><p>依篩選的期別與報型計算　開信率（實線）／開信點擊率（虛線）</p></div>
      <div class="cbody"><canvas class="chart" id="chTrend" height="90"></canvas></div>
    </div>

    <div class="card c4">
      <div class="chead"><h3>兩種報型對照　依目前篩選範圍</h3></div>
      <div class="cbody tight" id="typeCompare"></div>
    </div>
  `;
  document.getElementById("g0").innerHTML = html;

  const fs = filteredSends().slice().sort((a,b)=> a.date<b.date?-1:1);
  destroyChart("chTrend");
  charts.chTrend = new Chart(document.getElementById("chTrend"), {
    type:"line",
    data:{ labels: fs.map(r=>r.date),
      datasets:[
        {label:"開信率", data:fs.map(r=>+(r.pct_opened*100).toFixed(2)), borderColor:NAVY, backgroundColor:NAVY, tension:.25, pointRadius:3},
        {label:"開信點擊率", data:fs.map(r=>+(r.click_to_open_ratio*100).toFixed(2)), borderColor:GOLD, backgroundColor:GOLD, borderDash:[6,4], tension:.25, pointRadius:3},
      ]},
    options:{ responsive:true, plugins:{legend:{position:"bottom",labels:{color:MUTE}}},
      scales:{ x:{ticks:{color:MUTE,maxRotation:60,minRotation:60,font:{size:9}},grid:{display:false}},
               y:{ticks:{color:MUTE,callback:v=>v+"%"},grid:{color:GRID}} } }
  });

  // type compare table (weighted over filtered periods)
  const byType = {};
  filteredSends().forEach(r=>{
    const t=r.report_type;
    byType[t] ||= {sent:0,delivered:0,opened:0,clicked:0,unsub:0,reach:new Set()};
    byType[t].sent+=r.sent; byType[t].delivered+=r.delivered; byType[t].opened+=r.opened;
    byType[t].clicked+=r.clicked_email; byType[t].unsub+=r.unsubscribed;
  });
  LINKS.forEach(r=>{ if(r.eid && sel.periods.has(r.date) && sel.types.has(r.report_type)){ (byType[r.report_type]||(byType[r.report_type]={reach:new Set()})).reach ||= new Set(); byType[r.report_type].reach.add(r.eid); } });
  const t1="主題報", t2="好友報";
  const a=byType[t1]||{sent:0,delivered:0,opened:0,clicked:0,unsub:0,reach:new Set()};
  const b=byType[t2]||{sent:0,delivered:0,opened:0,clicked:0,unsub:0,reach:new Set()};
  const rate=(x,y)=> y? x/y : null;
  const rows = [
    ["送達數", num(a.delivered), num(b.delivered)],
    ["開信率", pct(rate(a.opened,a.delivered)), pct(rate(b.opened,b.delivered))],
    ["開信點擊率", pct(rate(a.clicked,a.opened)), pct(rate(b.clicked,b.opened))],
    ["退訂率", pct(rate(a.unsub,a.delivered)), pct(rate(b.unsub,b.delivered))],
    ["導入官網人數", num(a.reach.size), num(b.reach.size)],
  ];
  document.getElementById("typeCompare").innerHTML = `
    <table class="t"><thead><tr><th>指標</th><th class="n">${t1}</th><th class="n">${t2}</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="n">${r[2]}</td></tr>`).join("")}</tbody></table>
    <div class="note">主題報是單一連結導流，好友報一次放多個連結——兩者任務不同，數字結構本來就不會一樣，僅供對照不代表誰好誰壞。</div>`;
}

// ================= Tab 1: 寄送與開信 =================
function renderSend(){
  const cur = currentPeriod();
  const curRow = sendRow(cur);
  const reach = new Set(LINKS.filter(r=>r.date===cur && r.eid).map(r=>r.eid)).size;

  const stages = [
    ["寄出", curRow.sent],
    ["送達", curRow.delivered],
    ["開信", curRow.opened],
    ["點擊", curRow.clicked_email],
    ["進站（不重複人數）", reach],
  ];
  let funnelHtml = stages.map((s,i)=>{
    const pctOfPrev = i>0 ? (stages[i][1]/stages[i-1][1]*100).toFixed(1)+"%" : "";
    const width = (s[1]/stages[0][1]*100).toFixed(2);
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px">
        <span>${s[0]}</span><span class="mono">${num(s[1])} ${pctOfPrev?`<span style="color:var(--ink3)">（${pctOfPrev}）</span>`:""}</span>
      </div>
      <div style="background:var(--line2);border-radius:2px;height:14px"><div style="width:${width}%;background:${NAVY};opacity:.75;height:100%;border-radius:2px"></div></div>
    </div>`;
  }).join("");

  document.getElementById("g1").innerHTML = `
    <div class="card c6">
      <div class="chead"><h3>本期寄送流失　${cur}（${curRow.report_type}）</h3></div>
      <div class="cbody">${funnelHtml}
        <div class="note">硬退 ${num(curRow.hard_bounced)}、軟退 ${num(curRow.soft_bounced)}、退訂 ${num(curRow.unsubscribed)}。最大一段流失通常在<b>送達到開信之間</b>，改善空間也在這一段最大。</div>
      </div>
    </div>
    <div class="card c6">
      <div class="chead"><h3>指標趨勢　依報型分開</h3><p>開信率（實線）／開信點擊率（虛線）／退訂率（右軸）</p></div>
      <div class="cbody"><canvas class="chart" id="chByType" height="130"></canvas></div>
    </div>
  `;

  const fs = filteredSends().slice().sort((a,b)=>a.date<b.date?-1:1);
  const theme = fs.filter(r=>r.report_type==="主題報");
  const friend = fs.filter(r=>r.report_type==="好友報");
  const allDates = [...new Set(fs.map(r=>r.date))].sort();
  const byDate = (arr,f) => allDates.map(d=>{ const r=arr.find(x=>x.date===d); return r? +(f(r)*100).toFixed(3) : null; });

  destroyChart("chByType");
  charts.chByType = new Chart(document.getElementById("chByType"), {
    type:"line",
    data:{ labels: allDates,
      datasets:[
        {label:"主題報 開信率", data:byDate(theme,r=>r.pct_opened), borderColor:NAVY, tension:.25, spanGaps:true, pointRadius:3},
        {label:"主題報 點擊率", data:byDate(theme,r=>r.click_to_open_ratio), borderColor:NAVY, borderDash:[6,4], tension:.25, spanGaps:true, pointRadius:3},
        {label:"好友報 開信率", data:byDate(friend,r=>r.pct_opened), borderColor:TEAL, tension:.25, spanGaps:true, pointRadius:3},
        {label:"好友報 點擊率", data:byDate(friend,r=>r.click_to_open_ratio), borderColor:TEAL, borderDash:[6,4], tension:.25, spanGaps:true, pointRadius:3},
        {label:"退訂率", data:byDate(fs,r=>r.pct_unsubscribed), borderColor:RED, borderWidth:1.5, yAxisID:"y1", tension:.2, pointRadius:2},
      ]},
    options:{ responsive:true, plugins:{legend:{position:"bottom",labels:{color:MUTE,font:{size:10}}}},
      scales:{ x:{ticks:{color:MUTE,maxRotation:60,minRotation:60,font:{size:9}},grid:{display:false}},

}

// ================= Tab 2: 內容與導流 =================
function renderContent(){
  const links = filteredLinksContent();

  // 連結分類成效
  const catAgg = {};
  filteredLinks().forEach(r=>{ (catAgg[r.category] ||= {clicks:0,people:0}); catAgg[r.category].clicks+=r.clicks||0; catAgg[r.category].people+=r.people||0; });
  const catRows = Object.entries(catAgg).sort((a,b)=>b[1].clicks-a[1].clicks);
  const maxClicks = catRows.length? catRows[0][1].clicks : 1;

  // 官網文章庫使用狀況 (by 中分類)
  const artByMinor = {};
  ARTICLES.forEach(r=>{ if(!r["中分類"]) return; (artByMinor[r["中分類"]] ||= {total:0}); artByMinor[r["中分類"]].total++; });
  const usedByMinor = {};
  links.filter(r=>r.category==="生活提案文章").forEach(r=>{
    const k=r["中分類"]||"（未標中分類）";
    (usedByMinor[k] ||= {paths:new Set(), people:0});
    usedByMinor[k].paths.add(r.url_path); usedByMinor[k].people += r.people||0;
  });
  const usageRows = Object.keys(artByMinor).map(k=>{
    const total = artByMinor[k].total;
    const used = usedByMinor[k]? usedByMinor[k].paths.size : 0;
    const people = usedByMinor[k]? usedByMinor[k].people : 0;
    return {k, total, used, people, rate: total? used/total : 0, avg: used? people/used : 0};
  }).sort((a,b)=>b.people-a.people);

  // 常青文章
  const byArticle = {};
  links.filter(r=>r.category==="生活提案文章").forEach(r=>{
    const k=r.url_path;
    (byArticle[k] ||= {title:r.article_title||k, minor:r["中分類"]||"", dates:new Set(), people:0});
    byArticle[k].dates.add(r.date); byArticle[k].people += r.people||0;
  });
  const evergreen = Object.values(byArticle).filter(a=>a.dates.size>=2)
    .map(a=>({...a, n:a.dates.size, first:[...a.dates].sort()[0], last:[...a.dates].sort().slice(-1)[0]}))
    .sort((a,b)=> b.n-a.n || b.people-a.people).slice(0,10);

  // Top articles
  const topArticles = Object.entries(byArticle).map(([path,a])=>({path, ...a}))
    .sort((x,y)=> y.people-x.people).slice(0,20);

  // 未歸類
  const unmatched = {};
  filteredLinks().filter(r=> (r.category||"").startsWith("未歸類")).forEach(r=>{
    (unmatched[r.url_path] ||= 0); unmatched[r.url_path]+= r.people||0;
  });
  const unmatchedRows = Object.entries(unmatched).sort((a,b)=>b[1]-a[1]).slice(0,15);

  // heatmap: segment x 大分類 (whole-dataset segments, but click share within current period/type filter for relevance)
  const seg = computeSegments();
  const majors = [...new Set(ARTICLES.map(r=>r["大分類"]).filter(Boolean))];
  const segNames = ["核心重疊","準買家","高頻讀者"];
  const heat = {}; segNames.forEach(s=> heat[s]={});
  filteredLinks().filter(r=>r.category==="生活提案文章" && r.eid).forEach(r=>{
    const s = segmentOf(r.eid, seg);
    if(!segNames.includes(s)) return;
    const m = r["大分類"]||"（未分類）";
    heat[s][m] = (heat[s][m]||0) + (r.clicks||0);
  });
  const heatMajors = majors.filter(m=> segNames.some(s=>heat[s][m]));
  let heatHtml = "";
  if(heatMajors.length){
    const maxVal = Math.max(1,...segNames.flatMap(s=>heatMajors.map(m=>heat[s][m]||0)));
    heatHtml = `<table class="heat"><thead><tr><th></th>${heatMajors.map(m=>`<th>${m}</th>`).join("")}</tr></thead><tbody>
      ${segNames.map(s=>`<tr><td class="rowh">${s}</td>${heatMajors.map(m=>{
        const v=heat[s][m]||0; const op=(0.12+0.8*(v/maxVal)).toFixed(2);
        return `<td style="background:rgba(23,82,122,${op})">${v||"—"}</td>`;
      }).join("")}</tr>`).join("")}
    </tbody></table>`;
  } else {
    heatHtml = `<div class="note">目前篩選範圍內沒有足夠的分群點擊資料。</div>`;
  }

  document.getElementById("g2").innerHTML = `
    <div class="card c6">
      <div class="chead"><h3>連結分類成效</h3><p>依 Clicks 排序，依目前篩選的期別／報型計算</p></div>
      <div class="cbody">
        ${catRows.map(([cat,v])=>`
          <div style="margin-bottom:8px">
            <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span>${cat}</span><span class="mono">${num(v.clicks)}</span></div>
            <div style="background:var(--line2);border-radius:2px;height:12px"><div style="width:${(v.clicks/maxClicks*100).toFixed(1)}%;background:${NAVY};opacity:.7;height:100%;border-radius:2px"></div></div>
          </div>`).join("")}
        <div class="note">「未歸類」多為主題報每期專屬活動頁（如 /jan2026），非單篇文章。</div>
      </div>
    </div>

    <div class="card c6">
      <div class="chead"><h3>內容與受眾的配對熱力</h3><p>三群受眾（固定跨全期定義）在目前篩選範圍內，各對哪些文章大分類點擊最多</p></div>
      <div class="cbody">${heatHtml}
        <div class="note">格子顏色深淺代表點擊數。可用來決定「準買家」該推什麼內容、「高頻讀者」該用什麼內容養熟。</div>
      </div>
    </div>

    <div class="card c6">
      <div class="chead"><h3>官網文章庫使用狀況</h3><p>依文章中分類</p></div>
      <div class="cbody tight"><div class="twrap"><table class="t">
        <thead><tr><th>文章中分類</th><th class="n">官網篇數</th><th class="n">期間用過</th><th class="n">使用率</th><th class="n">帶進站人數</th><th class="n">每篇平均</th></tr></thead>
        <tbody>${usageRows.map(r=>`<tr><td>${r.k}</td><td class="n">${num(r.total)}</td><td class="n">${num(r.used)}</td><td class="n">${pct(r.rate)}</td><td class="n">${num(r.people)}</td><td class="n">${r.avg.toFixed(1)}</td></tr>`).join("")}</tbody>
      </table></div>
        <div class="note">官網文章庫遠大於實際用到的篇數，使用率低的中分類是還沒開發的內容庫存。</div>
      </div>
    </div>

    <div class="card c6">
      <div class="chead"><h3>常青文章　重複投放兩次以上</h3></div>
      <div class="cbody tight"><div class="twrap"><table class="t">
        <thead><tr><th>文章</th><th>中分類</th><th class="n">投放次數</th><th>首次投放</th><th>最近投放</th><th class="n">累計進站人數</th></tr></thead>
        <tbody>${evergreen.map(a=>`<tr><td>${a.title}</td><td>${a.minor}</td><td class="n">${a.n}</td><td class="n">${a.first}</td><td class="n">${a.last}</td><td class="n">${num(a.people)}</td></tr>`).join("") || '<tr><td colspan="6" style="color:var(--ink3)">目前篩選範圍內沒有重複投放兩次以上的文章</td></tr>'}</tbody>
      </table></div></div>
    </div>

    <div class="card c12">
      <div class="chead"><h3>熱門文章　Top 20</h3><p>依進站人數排序，來自對照表比對</p></div>
      <div class="cbody tight"><div class="twrap"><table class="t">
        <thead><tr><th>文章標題</th><th>中分類</th><th class="n">進站人數</th><th class="n">投放次數</th></tr></thead>
        <tbody>${topArticles.map(a=>`<tr><td>${a.title}</td><td>${a.minor}</td><td class="n">${num(a.people)}</td><td class="n">${a.dates.size}</td></tr>`).join("")}</tbody>
      </table></div></div>
    </div>

    <div class="card c12">
      <div class="chead"><h3>未歸類網址清單　（對照表需補的項目）</h3><p>People 加總前 15 名</p></div>
      <div class="cbody tight"><div class="twrap"><table class="t">
        <thead><tr><th>url_path</th><th class="n">People</th></tr></thead>
        <tbody>${unmatchedRows.map(([p,v])=>`<tr><td class="mono">${p}</td><td class="n">${num(v)}</td></tr>`).join("") || '<tr><td colspan="2" style="color:var(--ink3)">目前篩選範圍內沒有未歸類網址</td></tr>'}</tbody>
      </table></div></div>
    </div>
  `;
}

function renderAudience(){
  const seg = computeSegments();
  const segAud = SUMMARY.audience_segments;
  const health = SUMMARY.click_list_health;

  let cards = Object.entries(segAud.groups).map(([name,g])=>{
    const color = name==="核心重疊"?RED:(name==="準買家"?GOLD:NAVY);
    return `<div class="card c3"><div class="kpi">
      <div class="lbl">${name}</div><div class="val" style="color:${color}">${num(g.count)}</div>
      <div class="sub"><span class="base">${g.definition}</span></div>
    </div></div>`;
  }).join("");
  cards += `<div class="card c3"><div class="kpi">
      <div class="lbl">曾點擊過連結的不重複人數</div><div class="val">${num(health.unique_clickers_ever)}</div>
      <div class="sub"><span class="base">近3期活躍 ${num(health.active_in_last_3_periods)}　沉睡 ${num(health.dormant)}</span></div>
    </div></div>`;

  // 分群成效對照
  function groupStats(set){
    let clicks=0, bld=0;
    set.forEach(eid=>{ clicks += seg.eidTotalClicks[eid]||0; bld += seg.eidBuildingClicks[eid]||0; });
    return {n:set.size, clicks, bld, ratio: clicks? bld/clicks : 0};
  }
  const gCore = groupStats(seg.groups.核心重疊), gBuy = groupStats(seg.groups.準買家), gHigh = groupStats(seg.groups.高頻讀者);
  const totalClickers = health.unique_clickers_ever;
  const compareRows = [
    ["核心重疊", gCore], ["準買家", gBuy], ["高頻讀者", gHigh],
  ];

  // 高意圖名單
  const candidates = new Set([...seg.groups.核心重疊, ...seg.groups.準買家]);
  const list = [...candidates].map(eid=>{
    const articles = new Set(LINKS.filter(r=>r.eid===eid && r.category==="生活提案文章").map(r=>r.url_path));
    const tot = seg.eidTotalClicks[eid]||0, bld=seg.eidBuildingClicks[eid]||0;
    return {
      eid, periods: seg.eidPeriods[eid].size, tot, bld, ratio: tot?bld/tot:0,
      articles: articles.size, label: segmentOf(eid,seg),
    };
  }).sort((a,b)=> b.ratio-a.ratio || b.tot-a.tot).slice(0,30);

  document.getElementById("g3").innerHTML = `
    ${cards}
    <div class="card c8">
      <div class="chead"><h3>三群受眾　首次接觸檔次分佈</h3><p>每個人只算「第一次」出現的期別，看哪一期在幫忙開發新讀者</p></div>
      <div class="cbody"><canvas class="chart" id="chSegTrend" height="90"></canvas></div>
    </div>
    <div class="card c4">
      <div class="chead"><h3>分群成效對照</h3></div>
      <div class="cbody tight"><table class="t">
        <thead><tr><th>分群</th><th class="n">人數</th><th class="n">佔比</th><th class="n">總點擊</th><th class="n">建案點擊佔比</th></tr></thead>
        <tbody>${compareRows.map(([name,g])=>`<tr><td>${name}</td><td class="n">${num(g.n)}</td><td class="n">${pct(g.n/totalClickers)}</td><td class="n">${num(g.clicks)}</td><td class="n">${pct(g.ratio)}</td></tr>`).join("")}</tbody>
      </table>
      <div class="note">佔比是相對「曾點擊過連結的不重複人數（${num(totalClickers)}）」，不是全體訂閱戶。</div></div>
    </div>

    <div class="card c12">
      <div class="chead"><h3>高意圖名單　核心重疊 ∪ 準買家，依建案點擊佔比排序</h3></div>
      <div class="cbody tight"><div class="twrap"><table class="t">
        <thead><tr><th>收件代碼</th><th class="n">參與期數</th><th class="n">總點擊</th><th class="n">建案點擊</th><th class="n">建案佔比</th><th class="n">讀過文章數</th><th>分群</th></tr></thead>
        <tbody>${list.map(r=>`<tr><td class="mono">${r.eid}</td><td class="n">${r.periods}</td><td class="n">${r.tot}</td><td class="n">${r.bld}</td><td class="n">${pct(r.ratio)}</td><td class="n">${r.articles}</td><td>${r.label}</td></tr>`).join("")}</tbody>
      </table></div>
        <div class="note">共 ${candidates.size} 筆核心重疊／準買家名單，這裡列出建案點擊佔比最高的前 30 筆。收件代碼是雜湊過的代碼，同一人跨期看得出來是同一個，但這串代碼沒辦法用肉眼對照回 Google Sheets 找到真實 email——這是刻意設計成不可逆，公開頁面本來就不該讓人反查出聯絡方式。要產出給業務跟進用的完整名單（含真實 email），得另外寫一支只在內部跑、輸出不進這個公開 repo 的程式，直接讀 Google Sheets 原始資料算同一套分群邏輯。</div>
      </div>
    </div>
  `;

  const segNames = Object.keys(segAud.groups);
  const segColors = {核心重疊:RED, 準買家:GOLD, 高頻讀者:NAVY};
  destroyChart("chSegTrend");
  charts.chSegTrend = new Chart(document.getElementById("chSegTrend"), {
    type:"bar",
    data:{ labels: PERIODS,
      datasets: segNames.map(name=>({
        label:name, data: PERIODS.map(p=> segAud.groups[name].first_contact_by_period[p]||0),
        backgroundColor: segColors[name],
      })) },
    options:{ plugins:{legend:{position:"bottom",labels:{color:MUTE}}},
      scales:{ x:{stacked:true, ticks:{color:MUTE,maxRotation:60,minRotation:60,font:{size:9}}, grid:{display:false}},
               y:{stacked:true, ticks:{color:MUTE}, grid:{color:GRID}} } }
  });
}

      <div class="sub"><span class="base">${cur}　${curRow.report_type}</span></div>
    </div></div>
    <div class="card c3"><div class="kpi ${curRow.pct_unsubscribed>0.006?'alert':''}">
      <div class="lbl">最新一期退訂率</div><div class="val">${pct(curRow.pct_unsubscribed)}</div>
      <div class="sub"><span class="base">篩選範圍平均 ${pct(avgUnsub)}</span></div>
    </div></div>
    <div class="card c3"><div class="kpi">
      <div class="lbl">點擊層沉睡人數</div><div class="val">${num(health.dormant)}</div>
      <div class="sub"><span class="base">佔曾點擊過的 ${pct(health.dormant/health.unique_clickers_ever)}</span></div>
    </div></div>
    <div class="card c3"><div class="kpi">
      <div class="lbl">點擊層近3期活躍</div><div class="val">${num(health.active_in_last_3_periods)}</div>
      <div class="sub"><span class="base">佔曾點擊過的 ${pct(health.active_in_last_3_periods/health.unique_clickers_ever)}</span></div>
    </div></div>

    <div class="card c6">
      <div class="chead"><h3>退訂率　逐期趨勢</h3></div>
      <div class="cbody"><canvas class="chart" id="chUnsub" height="110"></canvas></div>
    </div>
    <div class="card c6">
      <div class="chead"><h3>送達數與硬退比例　逐期趨勢</h3></div>
      <div class="cbody"><canvas class="chart" id="chDeliver" height="110"></canvas></div>
    </div>

    <div class="card c12">
      <div class="chead"><h3>期別成績單</h3><p>依目前篩選範圍</p></div>
      <div class="cbody tight"><div class="twrap"><table class="t">
        <thead><tr><th>期別</th><th>報型</th><th class="n">送達</th><th class="n">開信率</th><th class="n">開信點擊率</th><th class="n">退訂率</th></tr></thead>
        <tbody>${fs.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${r.report_type}</td><td class="n">${num(r.delivered)}</td><td class="n">${pct(r.pct_opened)}</td><td class="n">${pct(r.click_to_open_ratio)}</td><td class="n">${pct(r.pct_unsubscribed)}</td></tr>`).join("")}</tbody>
      </table></div></div>
    </div>
  `;

  const theme = fs.filter(r=>r.report_type==="主題報");
  const friend = fs.filter(r=>r.report_type==="好友報");
  const allDates = [...new Set(fs.map(r=>r.date))].sort();
  const byDate=(arr,f)=>allDates.map(d=>{const r=arr.find(x=>x.date===d); return r?+(f(r)*100).toFixed(3):null;});

  destroyChart("chUnsub");
  charts.chUnsub = new Chart(document.getElementById("chUnsub"), {
    type:"line",
    data:{ labels: allDates, datasets:[
      {label:"主題報", data: byDate(theme,r=>r.pct_unsubscribed), borderColor:NAVY, tension:.25, spanGaps:true, pointRadius:3},
      {label:"好友報", data: byDate(friend,r=>r.pct_unsubscribed), borderColor:GOLD, tension:.25, spanGaps:true, pointRadius:3},
    ]},
    options:{ plugins:{legend:{position:"bottom",labels:{color:MUTE}}},
      scales:{ x:{ticks:{color:MUTE,maxRotation:60,minRotation:60,font:{size:9}},grid:{display:false}},
               y:{ticks:{color:MUTE,callback:v=>v+"%"},grid:{color:GRID}} } }
  });

  destroyChart("chDeliver");
  charts.chDeliver = new Chart(document.getElementById("chDeliver"), {
    type:"bar",
    data:{ labels: allDates, datasets:[
      {type:"bar", label:"送達數", data: allDates.map(d=>{const r=fs.find(x=>x.date===d); return r?r.delivered:null;}), backgroundColor:"rgba(122,140,160,.35)", yAxisID:"y"},
      {type:"line", label:"硬退比例", data: allDates.map(d=>{const r=fs.find(x=>x.date===d); return r?+(r.hard_bounced/r.sent*100).toFixed(3):null;}), borderColor:RED, yAxisID:"y1", tension:.2, pointRadius:3},
    ]},
    options:{ plugins:{legend:{position:"bottom",labels:{color:MUTE}}},
      scales:{ x:{ticks:{color:MUTE,maxRotation:60,minRotation:60,font:{size:9}},grid:{display:false}},
               y:{ticks:{color:MUTE},grid:{color:GRID}},
               y1:{position:"right",ticks:{color:RED,callback:v=>v+"%"},grid:{display:false}} } }
  });
}

// ================= Tab 5: 指標定義 =================
function renderDefs(){
  const defRows = [
    ["送達率","delivered ÷ sent","sent","電子報平台匯出","—"],
    ["開信率","opened ÷ delivered","delivered","電子報平台匯出","圖片被擋、預覽窗開信等會低估"],
    ["開信點擊率","clicked_email ÷ opened","opened","電子報平台匯出","受開信率低估連帶影響"],
    ["退訂率","unsubscribed ÷ delivered","delivered","電子報平台匯出","—"],
    ["連結分類","依網址規則判斷：/buildings/→建案；/case/search→建案搜尋；facebook.com→外部-FB；短網址→外部-短網址；unsubscribe→退訂；其餘比對「對照表」的官網連結→生活提案文章，比對不到→未歸類","—","links 分頁＋對照表","對照表沒有的新文章會先落在「未歸類」，需人工回補"],
    ["收件代碼（eid）","從連結網址的 ?eid= 參數取出（平台匯出時原始值其實是收件人真實 email），同步時立刻雜湊成 12 碼代碼再寫進 csv，同一人跨期雜湊值不變但不可逆推回 email","—","links 分頁（平台匯出時已內嵌於連結），雜湊邏輯見 scripts/lib/classify.py 的 hash_eid()","外部連結、活動頁短網址等沒有 eid，無法歸屬到個人；此頁面公開，因此絕不可把未雜湊的原始 email 寫進任何輸出檔案"],
    ["受眾三群定義","核心重疊＝參與≥3檔 且 點過建案連結；準買家＝建案點擊佔其總點擊≥50%；高頻讀者＝參與≥3檔 但從未點過建案連結","曾點擊過連結的不重複人數","links 分頁","只涵蓋曾經點擊過至少一次連結的人，不是全體訂閱戶；三群可能互斥也可能重疊（核心重疊與準買家可同時成立）"],
  ];

  document.getElementById("g5").innerHTML = `
    <div class="card c8">
      <div class="chead"><h3>指標定義表</h3></div>
      <div class="cbody tight"><div class="twrap"><table class="t">
        <thead><tr><th>指標</th><th>算法</th><th>分母</th><th>資料來源</th><th>已知限制</th></tr></thead>
        <tbody>${defRows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join("")}</tbody>
      </table></div></div>
    </div>
    <div class="card c4">
      <div class="chead"><h3>數字寫法規則</h3></div>
      <div class="cbody tight"><table class="t def"><tbody>
        <tr><th>比率本身</th><td>直接寫 %，例如開信率 <span class="mono">19.7%</span></td></tr>
        <tr><th>期間變化</th><td>一律寫<b>相對上期的增減幅度</b>，卡片下方會標出上期數值供對照。</td></tr>
        <tr><th>顏色</th><td><span class="rise">紅色 ▲ 代表上升</span>、<span class="fall">綠色 ▼ 代表下降</span>，只表示方向不代表好壞——退訂率的紅色是變差，開信率的紅色是變好。</td></tr>
      </tbody></table></div>
    </div>

    <div class="card c12">
      <div class="chead"><h3>資料缺口與後續規劃</h3></div>
      <div class="cbody tight"><div class="twrap"><table class="t">
        <thead><tr><th>項目</th><th>目前狀況</th><th>需要什麼</th></tr></thead>
        <tbody>
          <tr><td>來人與成交</td><td>完全沒有，無法判斷點擊之後是否轉換</td><td>接 GA4／CRM 的到訪、成交資料</td></tr>
          <tr><td>開信層級名單健康</td><td>只有彙總的開信數量／比例，沒有個人層級開信紀錄</td><td>拉個人層級的「開信」明細（同點擊明細格式）</td></tr>
          <tr><td>收件網域與開信時段</td><td>平台匯出沒有收件網域、沒有時間戳記</td><td>匯出格式補上這兩欄，才能做送達異常網域偵測、開信時段熱力圖</td></tr>
          <tr><td>好友報連結位置</td><td>links 分頁沒有記錄連結在信件中的第幾個位置</td><td>匯出格式補上位置欄位，才能拆解各位置點擊率</td></tr>
          <tr><td>名單建檔年份</td><td>沒有訂閱者建檔年份，無法看名單隨年份的衰退</td><td>另外拉名單成長／建檔明細</td></tr>
        </tbody>
      </table></div>
        <div class="note">同步機制：Google Sheets 作為每月輸入介面（唯一真實資料來源，只增不減）；GitHub Actions 每月排程自動同步成 csv/json；對照表新增文章只需補一列，分類公式／程式自動套用。</div>
      </div>
    </div>
  `;
}

})();
</script>
<div style="text-align:center;color:var(--ink3);font-size:11px;padding:16px">資料來源：data/*.csv（由 GitHub Actions 每月從 Google Sheets 同步產生）</div>
